    </linearGradient>
    <clipPath id="mask">
      <rect x="18" y="18" width="72" height="72" rx="16"/>
    </clipPath>
    <clipPath id="armClipFull">
      <rect x="32" y="57.5" width="52" height="9" rx="4.5"/>
