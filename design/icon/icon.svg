          <rect x="38" y="57.5" width="11.5" height="9" fill="#FFFFFF"/>
          <rect x="49.5" y="57.5" width="11.5" height="9" fill="#E23B2E"/>
          <rect x="61" y="57.5" width="11.5" height="9" fill="#FFFFFF"/>
          <rect x="72.5" y="57.5" width="11.5" height="9" fill="#E23B2E"/>
        </g>
      </g>
      <circle cx="38" cy="62" r="5.5" fill="#C3CFD7"/>
      <circle cx="38" cy="62" r="2" fill="#26333D"/>
    </g>
